name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: 编译 Release
        run: cargo build --release

      - name: 打包 zip
        shell: pwsh
        run: |
          Compress-Archive -Path target\release\udisk_tester.exe -DestinationPath udisk_tester-windows-x64.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: udisk_tester-windows-x64
          path: udisk_tester-windows-x64.zip

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: udisk_tester-windows-x64.zip
          generate_release_notes: true
