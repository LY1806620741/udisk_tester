name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: 安装 Linux 系统依赖（egui/eframe 编译需要）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libgl1-mesa-dev

      - name: 测试
        run: cargo test

      - name: 编译 Release
        run: cargo build --release
