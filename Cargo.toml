[package]
name = "udisk_tester"
version = "0.2.0"
edition = "2021"
description = "开源U盘校验测速工具（Rust版，仿H2testw）"

[dependencies]
eframe = "0.22"
rand = "0.8"
walkdir = "2"
chrono = "0.4"
# eframe 0.22 在 Windows 上依赖 winapi 的 winuser/windef 模块但未声明对应 feature，
# 这里显式开启以修复 Windows 下编译失败（feature 会在依赖图中合并）
winapi = { version = "0.3", features = ["windef", "winuser"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
